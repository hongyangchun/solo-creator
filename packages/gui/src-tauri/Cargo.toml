[package]
name = "solo-creator-gui"
version = "0.1.0"
description = "SoloCreator Content OS 桌面端"
authors = ["hongyangchun"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "solo_creator_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
